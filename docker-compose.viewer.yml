services:
  proteomics-viewer:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        FRONTEND_APP_MODE: viewer
        FRONTEND_AI_ENABLED: "0"
        FRONTEND_BASE_PATH: "/viewer/"
        FRONTEND_API_BASE: "/viewer"
        FRONTEND_RESET_ON_BROWSER_LOAD: "1"
    image: proteomics-copylot-viewer:latest
    container_name: proteomics-viewer
    restart: unless-stopped
    ports:
      - "127.0.0.1:18081:10000"
    environment:
      PORT: "10000"
      COPYLOT_VIEWER_MODE: "1"
      COPYLOT_AI_MODE: "0"
      COPYLOT_VIEWER_PORTAL_ENABLED: "1"
      COPYLOT_VIEWER_ACCESS_FILE: "/app/local/viewer_access.local.json"
      COPYLOT_VIEWER_QR_ACCESS_FILE: "/app/local/viewer_qr_access.local.json"
      COPYLOT_SESSION_ISOLATION: "1"
      COPYLOT_RESET_ON_BROWSER_LOAD: "1"
      COPYLOT_SESSION_COOKIE_SECURE: "1"
      COPYLOT_SESSION_COOKIE_NAME: "copylot_viewer_session_id"
      # The reverse proxy on the host reaches the container from the Docker bridge
      # gateway; trusting that range lets the login limiter see the real client
      # behind X-Forwarded-For instead of locking every client out together.
      # The port is bound to 127.0.0.1, so only host-local processes can set it.
      COPYLOT_TRUSTED_PROXY_IPS: "${COPYLOT_TRUSTED_PROXY_IPS:-172.16.0.0/12}"
      COPYLOT_ALLOWED_HOSTS: "${COPYLOT_ALLOWED_HOSTS:-localhost,127.0.0.1}"
      COPYLOT_HEAVY_MAX_CONCURRENCY: "${COPYLOT_HEAVY_MAX_CONCURRENCY:-2}"
      COPYLOT_HEAVY_MAX_QUEUE: "${COPYLOT_HEAVY_MAX_QUEUE:-8}"
      COPYLOT_HEAVY_QUEUE_TIMEOUT_SECONDS: "${COPYLOT_HEAVY_QUEUE_TIMEOUT_SECONDS:-20}"
      COPYLOT_THREAD_WORKERS: "${COPYLOT_THREAD_WORKERS:-16}"
      MPLCONFIGDIR: "/tmp/matplotlib"
      XDG_CACHE_HOME: "/tmp/cache"
    volumes:
      - ./viewer_data:/app/viewer_data:ro
      - ./local/viewer_access.local.json:/app/local/viewer_access.local.json:ro
      - ./local/viewer_qr_access.local.json:/app/local/viewer_qr_access.local.json:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=${COPYLOT_VIEWER_TMPFS_SIZE:-1g}
    mem_limit: "${COPYLOT_VIEWER_MEMORY_LIMIT:-6g}"
    cpus: "${COPYLOT_VIEWER_CPUS:-2.0}"

  proteomics-viewer-ai:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        FRONTEND_APP_MODE: viewer
        FRONTEND_AI_ENABLED: "1"
        FRONTEND_BASE_PATH: "/viewer-ai/"
        FRONTEND_API_BASE: "/viewer-ai"
        FRONTEND_RESET_ON_BROWSER_LOAD: "1"
    image: proteomics-copylot-viewer-ai:latest
    container_name: proteomics-viewer-ai
    restart: unless-stopped
    ports:
      - "127.0.0.1:18082:10000"
    environment:
      PORT: "10000"
      COPYLOT_VIEWER_MODE: "1"
      COPYLOT_AI_MODE: "1"
      COPYLOT_VIEWER_PORTAL_ENABLED: "1"
      COPYLOT_VIEWER_ACCESS_FILE: "/app/local/viewer_access.local.json"
      COPYLOT_VIEWER_QR_ACCESS_FILE: "/app/local/viewer_qr_access.local.json"
      COPYLOT_SESSION_ISOLATION: "1"
      COPYLOT_RESET_ON_BROWSER_LOAD: "1"
      COPYLOT_SESSION_COOKIE_SECURE: "1"
      COPYLOT_SESSION_COOKIE_NAME: "copylot_viewer_ai_session_id"
      # The reverse proxy on the host reaches the container from the Docker bridge
      # gateway; trusting that range lets the login limiter see the real client
      # behind X-Forwarded-For instead of locking every client out together.
      # The port is bound to 127.0.0.1, so only host-local processes can set it.
      COPYLOT_TRUSTED_PROXY_IPS: "${COPYLOT_TRUSTED_PROXY_IPS:-172.16.0.0/12}"
      COPYLOT_ALLOWED_HOSTS: "${COPYLOT_ALLOWED_HOSTS:-localhost,127.0.0.1}"
      COPYLOT_HEAVY_MAX_CONCURRENCY: "${COPYLOT_HEAVY_MAX_CONCURRENCY:-2}"
      COPYLOT_HEAVY_MAX_QUEUE: "${COPYLOT_HEAVY_MAX_QUEUE:-8}"
      COPYLOT_HEAVY_QUEUE_TIMEOUT_SECONDS: "${COPYLOT_HEAVY_QUEUE_TIMEOUT_SECONDS:-20}"
      COPYLOT_THREAD_WORKERS: "${COPYLOT_THREAD_WORKERS:-16}"
      MPLCONFIGDIR: "/tmp/matplotlib"
      XDG_CACHE_HOME: "/tmp/cache"
    volumes:
      - ./viewer_data:/app/viewer_data:ro
      - ./local/viewer_access.local.json:/app/local/viewer_access.local.json:ro
      - ./local/viewer_qr_access.local.json:/app/local/viewer_qr_access.local.json:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=${COPYLOT_VIEWER_TMPFS_SIZE:-1g}
    mem_limit: "${COPYLOT_VIEWER_MEMORY_LIMIT:-6g}"
    cpus: "${COPYLOT_VIEWER_CPUS:-2.0}"
