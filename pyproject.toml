[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proteomicscopylot"
version = "1.0.1"
description = "Notebook-facing plotting and analysis helpers for ProteomicsCoPYlot."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "ProteomicsCoPYlot contributors" }
]
keywords = ["proteomics", "phosphoproteomics", "plotting", "notebooks"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# Upper bounds are the next major release: these libraries have changed
# statistical defaults across majors before, and a published figure should not
# change because a transitive resolve picked up a new one. The exact versions the
# test suite is run against are recorded in backend/requirements.lock.
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<4",
  "matplotlib>=3.7,<4",
  "scipy>=1.10,<2",
  "seaborn>=0.12,<1",
  "pyarrow>=12,<24",
  "openpyxl>=3.1,<4",
  "scikit-learn>=1.3,<2",
  "matplotlib-venn>=1.0,<2",
  "plotly>=5.15,<8",
  "statsmodels>=0.14,<1",
]

[project.optional-dependencies]
bio = [
  "biopython",
]
dev = [
  "build",
  "httpx",
  "ipython",
  "nbformat>=4.2",
  "pytest",
  "twine",
  "wheel",
]

[tool.setuptools]
packages = ["proteomicscopylot", "proteomicscopylot.example_data"]
include-package-data = true

[tool.setuptools.package-data]
proteomicscopylot = [
  "notebook_functions.R",
  "data/*.csv",
  "data/*.md",
  "example_data/*.csv",
  "example_data/*.tsv",
  "example_data/*.md",
]

[tool.pytest.ini_options]
pythonpath = [".", "backend"]
addopts = "-ra"
markers = [
    # Runs the published example notebook end to end. Slower than a unit test
    # because it renders real figures; deselect with -m "not slow".
    "slow: exercises a full published workflow rather than one function",
]
