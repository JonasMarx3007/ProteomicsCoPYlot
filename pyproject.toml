[build-system]
requires = ["setuptools>=77", "wheel"]  # >=77: PEP 639 license / license-files fields below
build-backend = "setuptools.build_meta"

[project]
name = "proteomicscopylot"
version = "1.0.0"
description = "Notebook-facing plotting and analysis helpers for ProteomicsCoPYlot."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only AND CC-BY-4.0"
license-files = ["LICENSE", "NOTICE", "data/db/PACKAGED_README.md", "proteomicscopylot/example_data/README.md"]
authors = [
  { name = "Jonas Marx" }
]
keywords = ["proteomics", "phosphoproteomics", "plotting", "notebooks"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# Upper bounds are the next major release: these libraries have changed
# statistical defaults across majors before, and a published figure should not
# change because a transitive resolve picked up a new one. The exact versions the
# test suite is run against are recorded in backend/requirements.lock.
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<4",
  "matplotlib>=3.7,<4",
  "scipy>=1.10,<2",
  "seaborn>=0.12,<1",
  "pyarrow>=12,<27",
  "openpyxl>=3.1,<4",
  "scikit-learn>=1.3,<2",
  "matplotlib-venn>=1.0,<2",
  "plotly>=5.15,<8",
]

[project.optional-dependencies]
bio = [
  "biopython",
]
dev = [
  "build",
  "httpx2",
  "ipython",
  "mypy",
  "nbformat>=4.2",
  "pytest",
  "pytest-cov",
  "pytest-xdist",
  "ruff",
  "statsmodels>=0.14,<1",
  "twine",
  "wheel",
]

[tool.setuptools]
packages = ["proteomicscopylot", "proteomicscopylot.example_data"]
include-package-data = true

[tool.setuptools.package-data]
proteomicscopylot = [
  "notebook_functions.R",
  "data/*.csv",
  "data/*.md",
  "example_data/*.csv",
  "example_data/*.tsv",
  "example_data/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "backend"]
# Each worker has its own scientific libraries, stores and figures. Default
# to two to bound memory use; use -n auto explicitly on larger machines.
# Temporary files remain per test (tmp_path); -n 0 runs serially.
addopts = "-ra -n 2"
markers = [
    # Runs the published example notebook end to end. Slower than a unit test
    # because it renders real figures; deselect with -m "not slow".
    "slow: exercises a full published workflow rather than one function",
    # Set from the folder a test lives in (tests/conftest.py); see tests/README.md.
    "unit: one function or module, in tests/unit/",
    "reference: compared with an established implementation (scipy, statsmodels), in tests/reference/",
    "integration: through the API or a loaded project, in tests/integration/",
    "parity: the app, the pip package and the R functions agree, in tests/parity/",
    "contracts: frontend and backend agree on names and values, in tests/contracts/",
    "repo: repository layout and release hygiene, in tests/repo/",
]


# --- Linting ----------------------------------------------------------------
# Ruff replaces flake8 + isort + black. The frontend has been gated by tsc and
# ESLint in CI from the start; this closes the same gap on the Python side.
[tool.ruff]
line-length = 120
target-version = "py310"
# Notebooks star-import the package on purpose -- that is the documented way to
# use it -- so F403/F405 there describe the design, not a defect.
extend-exclude = ["build", "dist", "release", "local", "viewer_data", "*.ipynb"]

[tool.ruff.lint]
# Pyflakes only, to begin with. These are the rules that catch mistakes rather
# than opinions: unused imports and variables, redefinitions, undefined names.
# An unused import is what a stale refactor leaves behind, and it is invisible
# to the test suite until it breaks something unrelated.
# Style rules (E, W) and modernisation (UP, B) are worth adding later, once
# someone has time to work through the ~200 findings they produce today.
select = ["F"]

[tool.ruff.format]
# Configured so that `ruff format` is deterministic when someone runs it on a
# file they are already changing. It is not enforced: formatting the tree today
# rewrites 147 files, which would bury every future diff under it.
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint.per-file-ignores]
# `except ... as exc` is deliberate here: the handler logs through
# LOGGER.exception(), which reads the active exception rather than the name.
"backend/app/main.py" = ["F841"]
"backend/app/services/viewer_bootstrap.py" = ["F841"]
"backend/app/services/restore_state.py" = ["F841"]
# Shared pytest fixtures live in conftest.py files, never imported from another
# test module, so unused imports are reported under tests/ as everywhere else.

# --- Type checking ----------------------------------------------------------
# Deliberately lenient. A strict mypy on 500 KB of untyped scientific code
# produces thousands of findings and gets switched off within a week; this
# configuration catches the errors that do not need annotations to find, and
# can be tightened one module at a time with a [[tool.mypy.overrides]] block.
[tool.mypy]
# Match the locked Python 3.13 CI environment and its dependency stubs.
# Runtime compatibility remains tested separately on Python 3.10–3.13.
python_version = "3.13"
files = ["backend/app", "proteomicscopylot"]
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_configs = true
warn_redundant_casts = true
check_untyped_defs = false
disallow_untyped_defs = false

# Stepwise adoption (2026-10-06). CI runs `mypy` and must stay green. These
# modules had findings when mypy entered CI and are excluded until fixed; to
# adopt one, delete its line here and fix what mypy then reports. Never add a
# module to this list: new code is checked from the start.
[[tool.mypy.overrides]]
module = [
  "app.api.routes_annotations",
  "app.api.routes_chat",
  "app.api.routes_peptide",
  "app.api.routes_plots",
  "app.api.routes_restore",
  "app.api.routes_runtime",
  "app.schemas.plot_settings",
  "app.services.ai_functions",
  "app.services.analysis_functions",
  "app.services.annotation_store",
  "app.services.assistant_answers",
  "app.services.assistant_narrative",
  "app.services.assistant_routing",
  "app.services.assistant_styling",
  "app.services.canvas_focus",
  "app.services.chat_tools",
  "app.services.data_tools",
  "app.services.functions",
  "app.services.managed_temp",
  "app.services.metadata_upload_store",
  "app.services.notebook_archive",
  "app.services.notebook_interactive",
  "app.services.notebook_pca",
  "app.services.notebook_qc",
  "app.services.peptide_tools",
  "app.services.phospho_localization",
  "app.services.phospho_tools",
  "app.services.plot_export",
  "app.services.plot_images",
  "app.services.plot_limits",
  "app.services.plot_styling",
  "app.services.plot_webgl",
  "app.services.report_function",
  "app.services.restore_state",
  "app.services.scientific_assistant",
  "app.services.single_protein_tools",
  "app.services.stats_tools",
  "app.services.viewer_bootstrap",
  "proteomicscopylot.notebook_functions",
]
ignore_errors = true

# --- Coverage ---------------------------------------------------------------
# Gated in CI (tests.yml, Python 3.13 job). The floor sits a few points below
# the 85 % measured on 2026-10-02 with R installed -- that runner has no R, so
# the R bridge code runs less there. Raise it as coverage grows; do not lower it
# to make a run pass.
[tool.coverage.run]
source = ["backend/app", "proteomicscopylot"]
omit = ["*/__init__.py", "*/example_data/*"]

[tool.coverage.report]
fail_under = 82
skip_empty = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
