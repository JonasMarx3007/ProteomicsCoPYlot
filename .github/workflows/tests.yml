name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements.txt
            pyproject.toml

      - name: Install locked reference dependencies
        if: matrix.python == '3.13'
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.lock
          pip install --no-deps -e .

      - name: Install compatible dependencies
        if: matrix.python != '3.13'
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -e ".[dev]"

      # Once is enough: Pyflakes findings do not depend on the Python version.
      # Keep the version in step with the ruff hook in .pre-commit-config.yaml.
      - name: Lint Python (ruff, Pyflakes rules)
        if: matrix.python == '3.13'
        run: |
          pip install ruff==0.15.11
          ruff check .

      # The code-shape rules ruff has no rule for (tools/check_backend_rules.py).
      - name: Lint Python (backend code rules)
        if: matrix.python == '3.13'
        run: python tools/check_backend_rules.py

      # The package tests run on every supported Python, not only on the R
      # runner: the package claims 3.10-3.13. Their R comparisons skip here (no
      # R on this runner) and run in the cross-implementation workflow.
      - name: Run the tests
        if: matrix.python != '3.13'
        run: pytest -q

      # Coverage is measured once, on the locked reference environment; the
      # floor (fail_under) is in pyproject.toml.
      - name: Run the tests with coverage
        if: matrix.python == '3.13'
        run: pytest -q --cov --cov-report=term

      - name: Fail if the run littered the working tree
        run: |
          shopt -s nullglob
          artifacts=(VennDiagram.*.log)
          if [[ -e Rplots.pdf ]]; then artifacts+=(Rplots.pdf); fi
          if (( ${#artifacts[@]} )); then
            echo "test run left artifacts in the repository root:"
            printf '%s\n' "${artifacts[@]}"
            exit 1
          fi

  # Development and the desktop builds are Windows-first; the package is used
  # on macOS too. Locked reference environment only, to keep these jobs short.
  windows:
    name: backend and package (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install locked reference dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.lock
          pip install --no-deps -e .

      - name: Run the tests
        run: pytest -q

  macos:
    name: package (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install locked reference dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.lock
          pip install --no-deps -e .

      - name: Run package and parity tests
        run: pytest tests/unit/package tests/parity -q

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Audit dependencies
        run: npm audit --audit-level=high
        working-directory: frontend

      - name: Type-check and build
        run: npm run build
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Unit and component tests
        run: npm test
        working-directory: frontend

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install browser test backend
        run: |
          python -m pip install -r backend/requirements.lock
          python -m pip install --no-deps -e .

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Browser workflow regressions
        run: npm run test:browser
        working-directory: frontend

      - name: Viewer browser security regressions
        run: npm run test:viewer
        working-directory: frontend

      - name: Canvas scientific parity and state regressions
        run: npx playwright test --grep "end-to-end evidence|canvas layout preserves|canvas plot loading|large canvas|verifies typed canvas additions|offers ambiguous feature"
        working-directory: frontend
        env:
          VITE_AI_ENABLED: "1"
          COPYLOT_AI_MODE: "1"
          COPYLOT_BROWSER_ASSISTANT_STUB: "1"

      - name: Tool access-link regressions
        run: npx playwright test --config playwright.access.config.mjs
        working-directory: frontend

      - name: Viewer QR and project-isolation regressions
        run: npx playwright test --config playwright.access.config.mjs
        working-directory: frontend
        env:
          COPYLOT_ACCESS_MODE: viewer

  package:
    name: package distributions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packaging tools
        run: python -m pip install --upgrade pip build twine

      - name: Build and check distributions
        run: |
          python -m build
          python -m twine check dist/*

      # Installs the wheel with its declared dependencies into a clean
      # environment and runs a small analysis on the bundled example data from
      # outside the repository, so a missing file or dependency in the wheel fails.
      - name: Test wheel installation
        run: |
          python -m venv /tmp/copylot-wheel
          /tmp/copylot-wheel/bin/python -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          /tmp/copylot-wheel/bin/python "$GITHUB_WORKSPACE/packaging/python/smoke_test_wheel.py"

  deployment-config:
    name: deployment configuration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Docker Compose configurations
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.viewer.yml config --quiet

      - name: Check Dockerfile
        run: docker build --check .
