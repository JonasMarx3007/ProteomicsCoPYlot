name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements.txt
            pyproject.toml

      - name: Install locked reference dependencies
        if: matrix.python == '3.13'
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.lock
          pip install --no-deps -e .

      - name: Install compatible dependencies
        if: matrix.python != '3.13'
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -e ".[dev]"

      - name: Run backend and repository tests
        run: pytest tests/backend tests/repository -q

      - name: Fail if the run littered the working tree
        run: |
          shopt -s nullglob
          artifacts=(VennDiagram.*.log)
          if [[ -e Rplots.pdf ]]; then artifacts+=(Rplots.pdf); fi
          if (( ${#artifacts[@]} )); then
            echo "test run left artifacts in the repository root:"
            printf '%s\n' "${artifacts[@]}"
            exit 1
          fi

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Audit dependencies
        run: npm audit --audit-level=high
        working-directory: frontend

      - name: Type-check and build
        run: npm run build
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Unit tests
        run: node --test tests/*.test.mjs
        working-directory: frontend

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install browser test backend
        run: |
          python -m pip install -r backend/requirements.lock
          python -m pip install --no-deps -e .

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Browser workflow regressions
        run: npm run test:browser
        working-directory: frontend

      - name: Viewer browser security regressions
        run: npm run test:viewer
        working-directory: frontend

      - name: Tool access-link regressions
        run: npx playwright test --config playwright.access.config.mjs
        working-directory: frontend

      - name: Viewer QR and project-isolation regressions
        run: npx playwright test --config playwright.access.config.mjs
        working-directory: frontend
        env:
          COPYLOT_ACCESS_MODE: viewer

  package:
    name: package distributions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packaging tools
        run: python -m pip install --upgrade pip build twine

      - name: Build and check distributions
        run: |
          python -m build
          python -m twine check dist/*

      - name: Test wheel installation
        run: |
          python -m venv /tmp/copylot-wheel
          /tmp/copylot-wheel/bin/python -m pip install dist/*.whl
          /tmp/copylot-wheel/bin/python -c "import proteomicscopylot; print(proteomicscopylot.__file__)"

  deployment-config:
    name: deployment configuration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate Docker Compose configurations
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.viewer.yml config --quiet

      - name: Check Dockerfile
        run: docker build --check .
