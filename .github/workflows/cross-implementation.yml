name: cross-implementation

# The web app, the pip package and the R package are three hand-maintained
# implementations of the same analyses. These tests are the only thing that
# checks they still agree numerically, so they need a runner with R on it.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "proteomicscopylot/**"
      - "backend/app/**"
      - "tests/package/**"
      - "tests/r/**"
      - "examples/**"
      - "backend/requirements.lock"
      - "pyproject.toml"
      - ".github/workflows/cross-implementation.yml"
  pull_request:
    paths:
      - "proteomicscopylot/**"
      - "backend/app/**"
      - "tests/package/**"
      - "tests/r/**"
      - "examples/**"
      - "backend/requirements.lock"
      - "pyproject.toml"
      - ".github/workflows/cross-implementation.yml"

permissions:
  contents: read

concurrency:
  group: cross-implementation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    name: python / R agreement
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: "4.4.2"
          use-public-rspm: true

      - name: Cache R packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-${{ runner.os }}-${{ hashFiles('.github/workflows/cross-implementation.yml') }}

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libfontconfig1-dev \
                                  libharfbuzz-dev libfribidi-dev libfreetype6-dev libpng-dev \
                                  libtiff5-dev libjpeg-dev

      - name: Install R packages
        run: |
          install.packages(c("VennDiagram", "hexbin", "plotly", "readxl", "scatterplot3d", "arrow", "BiocManager"))
          BiocManager::install(c("vsn", "limma"), ask = FALSE, update = FALSE)
        shell: Rscript {0}

      - name: Report the R environment
        run: |
          cat("R", R.version.string, "\n")
          for (pkg in c("VennDiagram", "hexbin", "plotly", "readxl", "scatterplot3d", "arrow", "vsn", "limma")) {
            ok <- requireNamespace(pkg, quietly = TRUE)
            cat(sprintf("  %-15s %s\n", pkg, if (ok) as.character(packageVersion(pkg)) else "MISSING"))
          }
        shell: Rscript {0}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.lock
          pip install --no-deps -e .

      - name: Run standalone R notebook-function tests
        run: Rscript tests/r/test_notebook_functions.R

      - name: Run package and cross-implementation tests
        run: pytest tests/package -q

      - name: Fail if the run littered the working tree
        run: |
          shopt -s nullglob
          artifacts=(VennDiagram.*.log)
          if [[ -e Rplots.pdf ]]; then artifacts+=(Rplots.pdf); fi
          if (( ${#artifacts[@]} )); then
            echo "test run left artifacts in the repository root:"
            printf '%s\n' "${artifacts[@]}"
            exit 1
          fi
