name: cross-implementation

# The web app, the pip package and the R functions are three hand-maintained
# implementations of the same analyses. These tests are the only thing that
# checks they still agree numerically, so they need a runner with R on it.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "proteomicscopylot/**"
      - "backend/app/**"
      - "tests/**"
      - "examples/**"
      - "backend/requirements.lock"
      - "pyproject.toml"
      - ".github/workflows/cross-implementation.yml"
  pull_request:
    paths:
      - "proteomicscopylot/**"
      - "backend/app/**"
      - "tests/**"
      - "examples/**"
      - "backend/requirements.lock"
      - "pyproject.toml"
      - ".github/workflows/cross-implementation.yml"

permissions:
  contents: read

concurrency:
  group: cross-implementation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    name: python / R agreement
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          r-version: "4.4.2"
          use-public-rspm: true

      # tests/r/renv.lock pins every R package these tests use (CRAN snapshot
      # and Bioconductor release), so the comparisons run against the same R
      # code each time. The cache is keyed on the lockfile.
      - name: Cache R packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-${{ runner.os }}-4.4.2-${{ hashFiles('tests/r/renv.lock') }}

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libfontconfig1-dev \
                                  libharfbuzz-dev libfribidi-dev libfreetype6-dev libpng-dev \
                                  libtiff5-dev libjpeg-dev libuv1-dev

      - name: Install the locked R packages
        run: |
          options(HTTPUserAgent = sprintf("R/%s R (%s)", getRversion(),
            paste(getRversion(), R.version["platform"], R.version["arch"], R.version["os"])))
          if (!requireNamespace("renv", quietly = TRUE)) install.packages("renv")
          renv::restore(lockfile = "tests/r/renv.lock", library = Sys.getenv("R_LIBS_USER"), prompt = FALSE)
        shell: Rscript {0}

      - name: Report the R environment
        run: |
          cat("R", R.version.string, "\n")
          for (pkg in c("VennDiagram", "hexbin", "plotly", "readxl", "scatterplot3d", "arrow",
                        "jsonlite", "testthat", "vsn", "limma")) {
            ok <- requireNamespace(pkg, quietly = TRUE)
            cat(sprintf("  %-15s %s\n", pkg, if (ok) as.character(packageVersion(pkg)) else "MISSING"))
          }
        shell: Rscript {0}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.lock
          pip install --no-deps -e .

      - name: Run the R functions' own tests (testthat)
        run: Rscript tests/r/test_notebook_functions.R

      # COPYLOT_REQUIRE_R turns "R or an R package is missing" from a skip into
      # a failure, so a broken R setup cannot pass quietly.
      - name: Run package and cross-implementation tests
        env:
          COPYLOT_REQUIRE_R: "1"
          COPYLOT_REQUIRE_VSN: "1"
          COPYLOT_REQUIRE_LIMMA: "1"
        run: pytest tests/parity tests/unit/package -q -rs

      # The main test job has no R, so these skip there.
      - name: Run the other tests that call R
        env:
          COPYLOT_REQUIRE_VSN: "1"
          COPYLOT_REQUIRE_LIMMA: "1"
          COPYLOT_REQUIRE_R: "1"
        run: |
          pytest tests/unit tests/integration tests/reference -q -rs -m requires_r --ignore=tests/unit/package

      - name: Fail if the run littered the working tree
        run: |
          shopt -s nullglob
          artifacts=(VennDiagram.*.log)
          if [[ -e Rplots.pdf ]]; then artifacts+=(Rplots.pdf); fi
          if (( ${#artifacts[@]} )); then
            echo "test run left artifacts in the repository root:"
            printf '%s\n' "${artifacts[@]}"
            exit 1
          fi
