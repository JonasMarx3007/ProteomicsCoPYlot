version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      typescript-tooling:
        patterns: ["typescript", "typescript-eslint", "@typescript-eslint/*"]
    ignore:
      # Compiler major upgrades need a coordinated lint/compiler API migration.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Keep runtime types aligned with Node 24 in CI and the build tooling.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /
    versioning-strategy: increase-if-necessary
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /backend
    versioning-strategy: increase-if-necessary
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    groups:
      codeql:
        patterns: ["github/codeql-action/*"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
